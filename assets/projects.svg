<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes slide-cards {
      0%, 45% { transform: translateX(0px); }
      50%, 95% { transform: translateX(-370px); }
      100% { transform: translateX(0px); }
    }
    @keyframes card-hover-glow {
      0%, 100% { stroke: rgba(0, 242, 254, 0.3); }
      50% { stroke: rgba(255, 0, 127, 0.7); }
    }

    .slider-track { animation: slide-cards 12s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .project-card { animation: card-hover-glow 4s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect width="800" height="240" rx="14" fill="#090a0f" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="35" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ FEATURED PROJECTS SHOWCASE</text>

  <!-- Viewport Masking Area -->
  <g transform="translate(30, 50)">
    <g class="slider-track">

      <!-- Card 1: System Design Simulator -->
      <g transform="translate(0, 0)">
        <rect width="340" height="160" rx="10" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="1.5" class="project-card"/>
        <text x="20" y="35" fill="#00f2fe" font-family="sans-serif" font-size="16" font-weight="800">🌐 Distributed Simulator</text>
        <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="12">High-concurrency microservices visualizer built with NestJS &amp; WebSocket cluster.</text>

        <!-- Stats / Badges -->
        <rect x="20" y="115" width="60" height="20" rx="4" fill="#21262d"/><text x="50" y="129" fill="#58a6ff" font-family="sans-serif" font-size="10" text-anchor="middle">★ 1.2k</text>
        <rect x="90" y="115" width="65" height="20" rx="4" fill="#21262d"/><text x="122" y="129" fill="#a855f7" font-family="sans-serif" font-size="10" text-anchor="middle">NestJS</text>
        <rect x="165" y="115" width="70" height="20" rx="4" fill="#21262d"/><text x="200" y="129" fill="#ff007f" font-family="sans-serif" font-size="10" text-anchor="middle">Docker</text>
      </g>

      <!-- Card 2: AI Code Assistant Engine -->
      <g transform="translate(370, 0)">
        <rect width="340" height="160" rx="10" fill="url(#card-grad)" stroke="#7f00ff" stroke-width="1.5" class="project-card"/>
        <text x="20" y="35" fill="#a855f7" font-family="sans-serif" font-size="16" font-weight="800">🤖 Autonomous Code Agent</text>
        <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="12">LLM orchestrator tool with automated refactoring &amp; test suite generation.</text>

        <!-- Stats / Badges -->
        <rect x="20" y="115" width="60" height="20" rx="4" fill="#21262d"/><text x="50" y="129" fill="#58a6ff" font-family="sans-serif" font-size="10" text-anchor="middle">★ 850</text>
        <rect x="90" y="115" width="75" height="20" rx="4" fill="#21262d"/><text x="127" y="129" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">TypeScript</text>
        <rect x="175" y="115" width="60" height="20" rx="4" fill="#21262d"/><text x="205" y="129" fill="#27c93f" font-family="sans-serif" font-size="10" text-anchor="middle">OpenAI</text>
      </g>

      <!-- Card 3: Cloud Infrastructure CLI -->
      <g transform="translate(740, 0)">
        <rect width="340" height="160" rx="10" fill="url(#card-grad)" stroke="#27c93f" stroke-width="1.5" class="project-card"/>
        <text x="20" y="35" fill="#27c93f" font-family="sans-serif" font-size="16" font-weight="800">⚡ CloudOps CLI Tool</text>
        <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="12">Zero-config AWS/GCP multi-cloud deployment CLI for fast web apps.</text>

        <!-- Stats / Badges -->
        <rect x="20" y="115" width="60" height="20" rx="4" fill="#21262d"/><text x="50" y="129" fill="#58a6ff" font-family="sans-serif" font-size="10" text-anchor="middle">★ 2.4k</text>
        <rect x="90" y="115" width="60" height="20" rx="4" fill="#21262d"/><text x="120" y="129" fill="#ff9900" font-family="sans-serif" font-size="10" text-anchor="middle">Go / Rust</text>
      </g>

    </g>
  </g>
</svg>
