<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="15%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7f00ff"/>
      <stop offset="85%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="line-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-beam {
      0%, 100% { opacity: 0.6; stroke-width: 2; }
      50% { opacity: 1; stroke-width: 3.5; }
    }
    .neon-path { animation: pulse-beam 3s ease-in-out infinite; }
  </style>

  <line x1="20" y1="15" x2="980" y2="15" stroke="url(#neon-glow-line)" stroke-linecap="round" filter="url(#line-glow)" class="neon-path"/>
  <polygon points="500,8 508,15 500,22 492,15" fill="#00f2fe" filter="url(#line-glow)"/>
</svg>
