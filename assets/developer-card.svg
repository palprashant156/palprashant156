<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <filter id="avatar-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes float-card {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes status-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .card { animation: float-card 5s ease-in-out infinite; }
    .status-dot { animation: status-blink 2s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Card Background with Glassmorphism Border -->
  <g class="card" transform="translate(10, 10)">
    <rect width="780" height="220" rx="16" fill="url(#card-bg)" stroke="url(#neon-line)" stroke-width="1.5"/>

    <!-- Avatar Placeholder Graphic -->
    <g transform="translate(35, 35)">
      <circle cx="75" cy="75" r="60" fill="#21262d" stroke="#00f2fe" stroke-width="2" filter="url(#avatar-glow)"/>
      <!-- User / Dev Avatar Graphic -->
      <path d="M75,40 A22,22 0 1,0 75,84 A22,22 0 1,0 75,40 Z M45,118 C45,100 60,94 75,94 C90,94 105,100 105,118 Z" fill="#00f2fe"/>
    </g>

    <!-- Dev Info Text -->
    <g transform="translate(185, 40)">
      <!-- Name -->
      <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">
        Prashant Pal
      </text>

      <!-- Status Indicator -->
      <g transform="translate(160, 8)">
        <rect x="0" y="0" width="105" height="24" rx="12" fill="rgba(39, 201, 63, 0.15)" stroke="#27c93f" stroke-width="1"/>
        <circle cx="14" cy="12" r="4.5" fill="#27c93f" class="status-dot"/>
        <text x="26" y="16" fill="#27c93f" font-family="sans-serif" font-size="11" font-weight="700">ONLINE</text>
      </g>

      <!-- Title / Role -->
      <text x="0" y="52" fill="#8b949e" font-family="sans-serif" font-size="14" font-weight="600">
        🚀 Full Stack Engineer
      </text>

      <!-- Skills Chips -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="80" height="22" rx="6" fill="#21262d"/><text x="40" y="15" fill="#58a6ff" font-family="sans-serif" font-size="11" text-anchor="middle">TypeScript</text>
        <rect x="90" y="0" width="70" height="22" rx="6" fill="#21262d"/><text x="125" y="15" fill="#a855f7" font-family="sans-serif" font-size="11" text-anchor="middle">NestJS</text>
        <rect x="170" y="0" width="75" height="22" rx="6" fill="#21262d"/><text x="207" y="15" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">Next.js</text>
        <rect x="255" y="0" width="95" height="22" rx="6" fill="#21262d"/><text x="302" y="15" fill="#f43f5e" font-family="sans-serif" font-size="11" text-anchor="middle">System Design</text>
      </g>

      <!-- Level / EXP Progress Bar -->
      <g transform="translate(0, 115)">
        <text x="0" y="12" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="600">EXP LEVEL: FULL STACK ARCHITECT</text>
        <text x="500" y="12" fill="#00f2fe" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">88%</text>

        <rect x="0" y="20" width="500" height="8" rx="4" fill="#21262d"/>
        <rect x="0" y="20" width="440" height="8" rx="4" fill="url(#neon-line)"/>
      </g>
    </g>
  </g>
</svg>
