<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="rocket-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbd2e"/>
      <stop offset="100%" stop-color="#ff5f56" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes wave-move-1 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-500px); }
    }
    @keyframes wave-move-2 {
      0% { transform: translateX(-500px); }
      100% { transform: translateX(0); }
    }
    @keyframes rocket-fly {
      0% { transform: translate(120px, 140px) rotate(45deg); }
      50% { transform: translate(500px, 60px) rotate(45deg); }
      100% { transform: translate(880px, -60px) rotate(45deg); }
    }
    @keyframes flame-flicker {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.4); }
    }

    .wave1 { animation: wave-move-1 12s linear infinite; }
    .wave2 { animation: wave-move-2 8s linear infinite; }
    .rocket-group { animation: rocket-fly 8s ease-in-out infinite; }
    .flame { animation: flame-flicker 0.3s ease-in-out infinite; transform-origin: top center; }
  </style>

  <!-- Background Shell -->
  <rect width="1000" height="200" rx="16" fill="#090a0f"/>

  <!-- Starry Sky background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="100" cy="40" r="1"/>
    <circle cx="300" cy="20" r="1.5"/>
    <circle cx="550" cy="50" r="1"/>
    <circle cx="750" cy="30" r="2"/>
    <circle cx="920" cy="60" r="1.2"/>
  </g>

  <!-- Animated Waves -->
  <g transform="translate(0, 50)">
    <!-- Wave Layer 2 -->
    <path class="wave2" d="M0,80 Q250,40 500,80 T1000,80 T1500,80 L1500,150 L0,150 Z" fill="url(#wave-grad-2)"/>
    <!-- Wave Layer 1 -->
    <path class="wave1" d="M0,90 Q250,130 500,90 T1000,90 T1500,90 L1500,150 L0,150 Z" fill="url(#wave-grad-1)"/>
  </g>

  <!-- Rocket Taking Off -->
  <g class="rocket-group">
    <!-- Rocket Body -->
    <path d="M0,-20 C10,-10 10,10 0,20 C-10,10 -10,-10 0,-20 Z" fill="#ffffff"/>
    <path d="M0,-20 C5,-10 5,10 0,20 Z" fill="#e6edf3"/>
    <!-- Rocket Wings -->
    <path d="M-8,5 L-14,18 L-6,14 Z" fill="#ff007f"/>
    <path d="M8,5 L14,18 L6,14 Z" fill="#ff007f"/>
    <!-- Window -->
    <circle cx="0" cy="-4" r="3.5" fill="#00f2fe"/>
    <!-- Flame -->
    <polygon points="-4,20 0,35 4,20" fill="url(#rocket-flame)" class="flame"/>
  </g>

  <!-- Footer Text -->
  <text x="500" y="165" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="3">
    ⚡ THANK YOU FOR VISITING! LET'S CONNECT &amp; BUILD THE FUTURE ⚡
  </text>
</svg>
